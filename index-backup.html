<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundguru| India's No 1 Crowdfunding and Fundraising Platform</title>

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo/FundGuru_transparent.png">


<style>
  * {
       margin: 0; 
       padding: 0; 
       box-sizing: border-box; 
      }

  :root {
      --bg: white;
      --bg-hard: #222222;
      --orange: #4aac3a;
      --orange-soft: #1591DC;
      --white: #ffffff;
      --text: #222222;
      --muted: #b9adc7;
      --line: rgba(255,255,255,0.11);
      --shadow: 0 28px 80px rgba(0,0,0,0.42);
      --nav: white;
     
    }     

    body {
      font-family: "Calibri", sans-serif;
      font-weight: 100;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }  


    /* navbar */

    a {
       color: inherit; 
       text-decoration: none; 
      }

     .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 5rem;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--nav);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    
    }

    .logo {
       width: 9rem;
       height: 4rem;
       padding-top: 0.5rem;
       display: flex; 
       align-items: center; 
       font-size: 1.4rem; 
       font-weight: 900; 
       color: var(--white); 
      }

    .logo img {
       height: 100%; 
       width: 100%; 
       object-fit: contain; 
      }

      .logo img {
  transition: filter 0.25s ease;
}

.nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.4rem;
      color: var(--bg-hard);
      font-size: 1.2rem;
      font-weight: 500;
      
    }

    .nav-links a{
        transition: all 0.3s ease-in;
    }

    .nav-links a:hover { 
      color: var(--orange);
      
      
    }

    .nav-actions {
       display: flex; 
       align-items: center; 
       gap: 0.8rem; 
      }

    .theme-toggle {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--orange-soft);
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .theme-toggle:hover {
       transform: translateY(-2px); 
       border-color: var(--orange-soft); 
      }

    .cta-btn {
      background: var(--white);
      color: var(--orange);
      padding: 0.5rem 1rem;
      border: 1px solid var(--orange);
      border-radius: 2rem;
      font-weight: 300;
       transition: all 0.3s ease-in;
   
    }

    body.light-mode .cta-btn {
       background: var(--orange); 
       border-color: var(--orange); 
       color: #fff; 
      }


    .cta-btn:hover {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      transform: translateY(-2px);
    }

    .menu-btn {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .menu-btn span {
      width: 28px;
      height: 3px;
      border-radius: 99px;
      background: var(--bg-hard);
      transition: 0.25s ease;
    }

    #i-class{
        position: relative;
        top: 3px;
        right: 4px;
        padding: 0;
         transition: all 0.3s ease-in;
    }

    #i-class:hover{
       transform: rotate(180deg);
    }

    
    @media (max-width: 1000px) {
      
      .nav-links{gap: 0.6rem; font-size: 1rem; }
      .nav-actions { font-size: 0.8rem; gap: 0.5rem;}
      .nav-links, .cta-btn { display: none; }
       .menu-btn { display: flex; }
      

    }

    @media (max-width: 786px) {
      
    
      
    }
    

</style>


</head>
<body>
    
<!-- navbar -->


<nav class="navbar">
    <a href="index.html" class="logo"><img src="vector-logo.png" alt="fundguru logo"></a>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="donate.html">Donate <i class="fa-solid fa-angle-down" id="i-class"></i></a></li>
      <li><a href="fundraise.html">Fundraise <i class="fa-solid fa-angle-down" id="i-class"></i></a></li>
      <li><a href="about.html">About <i class="fa-solid fa-angle-down" id="i-class"></i></a></li>
      <li><a href="contact-us.html">Contact us</a></li>
    
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="cta-btn">Sign in</a>
      <a href="register.html" class="cta-btn">Register</a>
      <button class="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </nav>






<script>

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");
    let mobileMenu = document.querySelector(".mobile-menu");


    if (!mobileMenu && navLinks) {
      mobileMenu = document.createElement("div");
      mobileMenu.className = "mobile-menu";
      mobileMenu.innerHTML = navLinks.outerHTML;
      document.body.appendChild(mobileMenu);
    }

    const dynamicStyle = document.createElement("style");
    dynamicStyle.textContent = `
      .mobile-menu {
        position: fixed;
        top: 4.5rem;
        left: 0;
        width: 100%;
        max-height: 0;
        overflow: hidden;
        background: var(--white);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--line);
        z-index: 999;
        transition: max-height 0.35s ease;
      }
      .mobile-menu.show { max-height: 420px; }
      .mobile-menu .nav-links {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 1rem 1.25rem 1.4rem;
      }
      .mobile-menu .nav-links li {
        width: 100%;
        list-style: none;
        border-bottom: 1px solid var(--line);
      }
      .mobile-menu .nav-links a {
        display: block;
        padding: 1rem 0;
        color: var(--bg-hard);
        font-weight: 700;
      }
      .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
      .menu-btn.active span:nth-child(2) { opacity: 0; }
      .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
    `;
    document.head.appendChild(dynamicStyle);

    if (menuBtn && mobileMenu) {
      menuBtn.addEventListener("click", () => {
        menuBtn.classList.toggle("active");
        mobileMenu.classList.toggle("show");
      });

      mobileMenu.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
          menuBtn.classList.remove("active");
          mobileMenu.classList.remove("show");
        });
      });
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth > 700 && mobileMenu && menuBtn) {
        menuBtn.classList.remove("active");
        mobileMenu.classList.remove("show");
      }
    });
</script>

</body>
</html>
