<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Kindr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #f47600;
      --green-dark: #363636;
      --ink: #222222;
      --muted: #68727d;
      --white: #ffffff;
      --line: rgba(34,34,34,0.12);
      --shadow: 0 24px 70px rgba(34,34,34,0.14);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 5.5rem 1rem 2rem;
      font-family: Calibri, Arial, sans-serif;
      background: #f7faf7;
      color: var(--ink);
    }
    
    .logo {
       width: 9rem;
       height: 4rem;
       padding-top: 0.5rem;
       display: flex;
       align-items: center;
       font-size: 1.4rem;
       font-weight: 900;
       color: var(--white);

        position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      color: var(--green);
      font-size: 1.45rem;
      font-weight: 900;
      }

    .logo img {
       height: 100%;
       width: 100%;
       object-fit: contain;
       transition: filter 0.25s ease;
      }



    a { color: inherit; text-decoration: none; }
    .home-logo {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      color: var(--green);
      font-size: 1.45rem;
      font-weight: 900;
    }
    .auth-shell {
      width: min(100%, 58rem);
      display: grid;
      grid-template-columns: 0.9fr 1fr;
      overflow: hidden;
      border-radius: 1.25rem;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .auth-panel {
      padding: 2.3rem;
      background: #182018;
      color: var(--white);
    }
    .panel-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--green);
      font-size: 1.6rem;
      font-weight: 900;
    }
    .panel-mark span {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
    }
    .auth-panel h1 {
      margin-top: 4.2rem;
      font-size: 2.25rem;
      line-height: 1;
      font-weight: 900;
    }
    .auth-panel p {
      margin-top: 1rem;
      color: rgba(255,255,255,0.72);
      font-size: 1rem;
      line-height: 1.5;
    }
    .contact-list {
      display: grid;
      gap: 0.8rem;
      margin-top: 2rem;
    }
    .contact-item {
      padding: 0.85rem;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 0.8rem;
      color: rgba(255,255,255,0.76);
    }
    .contact-item b {
      display: block;
      color: var(--white);
      font-weight: 900;
    }
    .contact-item span {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.92rem;
    }
    .form-wrap {
      padding: 2.1rem;
    }
    .form-wrap h2 {
      font-size: 1.7rem;
      font-weight: 900;
    }
    .form-wrap > p {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.3rem;
    }
    label {
      display: grid;
      gap: 0.32rem;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
    }
    .full { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%;
      min-height: 2.65rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    textarea {
      min-height: 6.5rem;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 0.22rem rgba(74,172,58,0.12);
    }
    button {
      grid-column: 1 / -1;
      min-height: 2.85rem;
      border: 0;
      border-radius: 99rem;
      background: var(--green);
      color: var(--white);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(74,172,58,0.22);
    }
    @media (max-width: 820px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-panel { padding: 1.8rem; }
      .auth-panel h1 { margin-top: 2rem; font-size: 2rem; }
      .form-wrap { padding: 1.8rem; }
    }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a href="fundguru-hero-with-process.html" class="home-logo"><a href="#" class="logo"><img src="logo2.jpeg" alt="fundguru logo"></a></a>
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="panel-mark"><span></span> Kindr</div>
      <h1>We are here to help.</h1>
      <p>Have a question about donations, fundraiser setup, verification, or campaign support? Send us a message.</p>
      <div class="contact-list">
        <div class="contact-item"><b>Email support</b><span>support@fundguru.in</span></div>
        <div class="contact-item"><b>Phone</b><span>+91 98765 43210</span></div>
        <div class="contact-item"><b>Office</b><span>Bengaluru, India</span></div>
      </div>
    </section>

    <section class="form-wrap">
      <h2>Contact us</h2>
      <p>Tell us what you need and our team will reply soon.</p>
      <form>
        <label>First name <input type="text" placeholder="First name" required></label>
        <label>Last name <input type="text" placeholder="Last name" required></label>
        <label>Email address <input type="email" placeholder="you@example.com" required></label>
        <label>Mobile number <input type="tel" placeholder="+91 98765 43210"></label>
        <label class="full">Topic
          <select required>
            <option value="">Select a topic</option>
            <option>Starting a fundraiser</option>
            <option>Donation support</option>
            <option>Verification help</option>
            <option>Technical issue</option>
          </select>
        </label>
        <label class="full">Message <textarea placeholder="Tell us how we can help." required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
</body>
</html>
